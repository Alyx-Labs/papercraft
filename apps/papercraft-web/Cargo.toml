[package]
name = "papercraft-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "PaperCraft online web preview running in WebAssembly"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "papercraft_app"
path = "src/main.rs"

[dependencies]
papercraft-doc.workspace = true
papercraft-engine.workspace = true
papercraft-sync.workspace = true
papercraft-sync-protocol.workspace = true
papercraft-ui-egui.workspace = true
eframe.workspace = true
egui.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "BeforeUnloadEvent",
    "Blob",
    "BlobPropertyBag",
    "BroadcastChannel",
    "ClipboardEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomException",
    "DomRect",
    "DomStringList",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "Headers",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "IdbCursor",
    "IdbCursorWithValue",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "PageTransitionEvent",
    "PointerEvent",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "StorageEstimate",
    "StorageEvent",
    "StorageManager",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Url",
    "VisibilityState",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "console",
] }

[lints]
workspace = true
