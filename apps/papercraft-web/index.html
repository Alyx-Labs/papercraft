<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Craft - Online Handwriting &amp; Notes Studio</title>
    <meta name="description" content="Pure Rust handwriting, drawing, and notebook studio running 100% in the browser via WebAssembly.">

    <link data-trunk rel="icon" href="../papercraft/assets/branding/papercraft-128.png" />
    <link data-trunk rel="copy-file" href="../papercraft/assets/branding/papercraft-256.png" />
    <link data-trunk rel="copy-file" href="../../crates/ui-egui/assets/fonts/BricolageGrotesque-Bold.ttf" />
    <link data-trunk rel="rust" data-bin="papercraft_app" />

    <style>
        @font-face {
            font-family: "Bricolage Grotesque";
            src: url("./BricolageGrotesque-Bold.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
            font-display: block;
        }

        :root {
            color-scheme: dark;
            --bg-canvas: #0F1117;
            --bg-surface: #15181F;
            --bg-track: #232834;
            --bg-pill: #15293B;
            --border-subtle: #2A303D;
            --border-divider: #222733;
            --text-primary: #EDF0F6;
            --text-muted: #9AA3B5;
            --text-dim: #7D8799;
            --brand-sky: #82CAF2;
            --brand-sky-border: rgba(130, 202, 243, 0.72);
            --brand-accent: #3B76EC;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-canvas);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #the_canvas_id {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 20px;
            background:
                radial-gradient(680px 340px at 50% 34%, rgba(130, 202, 243, 0.09), transparent 72%),
                var(--bg-canvas);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            pointer-events: none;
        }

        .splash-card {
            width: min(440px, calc(100vw - 32px));
            box-sizing: border-box;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 28px 28px 22px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.48);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .splash-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .splash-logo {
            position: relative;
            width: 58px;
            height: 58px;
            border-radius: 13px;
            border: 1.5px solid var(--brand-sky-border);
            background: #82CAF3;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 6px 20px rgba(10, 114, 181, 0.22);
        }

        .splash-logo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .splash-logo-fallback {
            display: none;
            width: 100%;
            height: 100%;
            place-items: center;
            font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: -0.02em;
            color: #0F1117;
        }

        .splash-title-group {
            min-width: 0;
        }

        .splash-wordmark {
            font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-weight: 700;
            font-size: clamp(1.65rem, 4.2vw, 2rem);
            line-height: 1.06;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            margin: 0;
        }

        .splash-wordmark .craft {
            color: var(--brand-sky);
        }

        .splash-subtitle {
            margin: 4px 0 0;
            font-size: 0.84rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .splash-progress {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .splash-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .progress-track {
            width: 100%;
            height: 3px;
            border-radius: 999px;
            background: var(--bg-track);
            overflow: hidden;
        }

        .progress-bar {
            width: 42%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--brand-accent) 0%, var(--brand-sky) 100%);
            animation: splash-sweep 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            transform-origin: left center;
        }

        @keyframes splash-sweep {
            0% {
                transform: translateX(-110%);
            }
            100% {
                transform: translateX(270%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .progress-bar {
                width: 65%;
                animation: none;
            }
        }

        .splash-license {
            border-top: 1px solid var(--border-divider);
            padding-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 12px;
        }

        .license-badge-group {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .license-pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            background: var(--bg-pill);
            border: 1px solid rgba(130, 202, 243, 0.24);
            color: var(--brand-sky);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .license-name {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .license-note {
            font-size: 0.73rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div id="loading" role="status" aria-live="polite" aria-label="Loading Paper Craft">
        <div class="splash-card">
            <div class="splash-brand">
                <div class="splash-logo" aria-hidden="true">
                    <img
                        src="./papercraft-256.png"
                        alt=""
                        width="58"
                        height="58"
                        onerror="this.style.display='none';this.nextElementSibling.style.display='grid';"
                    />
                    <span class="splash-logo-fallback">PC</span>
                </div>
                <div class="splash-title-group">
                    <h1 class="splash-wordmark">Paper <span class="craft">Craft</span></h1>
                    <p class="splash-subtitle">Handwriting &amp; Notes Studio</p>
                </div>
            </div>

            <div class="splash-progress">
                <div class="splash-status">
                    <span>Loading WebAssembly workspace...</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar"></div>
                </div>
            </div>

            <div class="splash-license">
                <div class="license-badge-group">
                    <span class="license-pill">Open Source</span>
                    <span class="license-name">MIT OR Apache-2.0 License</span>
                </div>
                <span class="license-note">Pure Rust &amp; WebAssembly</span>
            </div>
        </div>
    </div>

    <canvas id="the_canvas_id"></canvas>
</body>
</html>
