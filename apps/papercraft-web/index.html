<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="text-scale" content="scale">
    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            try {
                var meta = document.querySelector('meta[name="color-scheme"]');
                if (!meta) return;

                function resolveTheme() {
                    if (!window.localStorage) return null;
                    var hint = window.localStorage.getItem("papercraft_theme_v1");
                    if (hint === "light" || hint === "dark") return hint;

                    var raw = window.localStorage.getItem("papercraft_workspace_v1");
                    if (!raw) return null;
                    var cache = JSON.parse(raw);
                    if (!cache || typeof cache !== "object") return null;

                    var global = cache.global || {};
                    var profile = null;

                    if (global.active_local_profile_id && cache.local_profiles) {
                        profile = cache.local_profiles[global.active_local_profile_id];
                    } else if (cache.guest) {
                        profile = cache.guest;
                    }

                    var theme = profile && profile.prefs && profile.prefs.theme;
                    if (theme === "Light") return "light";
                    if (theme === "Dark") return "dark";
                    return null;
                }

                function applyTheme() {
                    meta.content = resolveTheme() || "light dark";
                }

                applyTheme();
                window.addEventListener("storage", function (e) {
                    if (
                        !e ||
                        e.key === null ||
                        e.key === "papercraft_theme_v1" ||
                        e.key === "papercraft_workspace_v1"
                    ) {
                        applyTheme();
                    }
                });
            } catch (e) {}
        })();
    </script>
    <title>Paper Craft - Online Handwriting &amp; Notes Studio</title>
    <meta name="description" content="Pure Rust handwriting, drawing, and notebook studio running 100% in the browser via WebAssembly.">

    <link data-trunk rel="icon" href="../papercraft/assets/branding/papercraft-128.png" />
    <link data-trunk rel="copy-file" href="../papercraft/assets/branding/papercraft-256.png" />
    <link data-trunk rel="copy-file" href="../../crates/ui-egui/assets/fonts/BricolageGrotesque-Bold.ttf" />
    <link data-trunk rel="rust" data-bin="papercraft_app" />

    <style>
        @font-face {
            font-family: "Bricolage Grotesque";
            src: url("./BricolageGrotesque-Bold.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            color-scheme: light dark;
            --bg-canvas-light: #F8FBFD;
            --bg-canvas-dark: #191B20;
            --bg-track-light: #DCE8F0;
            --bg-track-dark: #2F343D;
            --text-primary-light: #13202B;
            --text-primary-dark: #EFF2F7;
            --text-secondary-light: #354A5C;
            --text-secondary-dark: #C8D0DC;
            --text-muted-light: #516779;
            --text-muted-dark: #A3ACB9;
            --accent-brand-light: #0C6FA6;
            --accent-brand-dark: #82CAF2;
        }

        :root:has(> head > meta[name="color-scheme"][content="dark"]) {
            color-scheme: dark;
        }

        :root:has(> head > meta[name="color-scheme"][content="light"]) {
            color-scheme: light;
        }

        @supports (color: light-dark(white, black)) {
            :root {
                --bg-canvas: light-dark(var(--bg-canvas-light), var(--bg-canvas-dark));
                --bg-track: light-dark(var(--bg-track-light), var(--bg-track-dark));
                --text-primary: light-dark(var(--text-primary-light), var(--text-primary-dark));
                --text-secondary: light-dark(var(--text-secondary-light), var(--text-secondary-dark));
                --text-muted: light-dark(var(--text-muted-light), var(--text-muted-dark));
                --accent-brand: light-dark(var(--accent-brand-light), var(--accent-brand-dark));
            }
        }

        @supports not (color: light-dark(white, black)) {
            :root {
                --bg-canvas: var(--bg-canvas-light);
                --bg-track: var(--bg-track-light);
                --text-primary: var(--text-primary-light);
                --text-secondary: var(--text-secondary-light);
                --text-muted: var(--text-muted-light);
                --accent-brand: var(--accent-brand-light);
            }

            @media (prefers-color-scheme: dark) {
                :root:not(:has(> head > meta[name="color-scheme"][content="light"])) {
                    --bg-canvas: var(--bg-canvas-dark);
                    --bg-track: var(--bg-track-dark);
                    --text-primary: var(--text-primary-dark);
                    --text-secondary: var(--text-secondary-dark);
                    --text-muted: var(--text-muted-dark);
                    --accent-brand: var(--accent-brand-dark);
                }
            }

            :root:has(> head > meta[name="color-scheme"][content="dark"]) {
                --bg-canvas: var(--bg-canvas-dark);
                --bg-track: var(--bg-track-dark);
                --text-primary: var(--text-primary-dark);
                --text-secondary: var(--text-secondary-dark);
                --text-muted: var(--text-muted-dark);
                --accent-brand: var(--accent-brand-dark);
            }
        }

        html, body {
            margin: 0;
            padding: 0;
            inline-size: 100%;
            block-size: 100%;
            overflow: hidden;
            background-color: var(--bg-canvas);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #the_canvas_id {
            position: absolute;
            inset-inline-start: 0;
            inset-block-start: 0;
            inline-size: 100%;
            block-size: 100%;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            place-items: safe center;
            min-block-size: 100dvh;
            padding: clamp(1.25rem, 4dvw, 2.5rem);
            box-sizing: border-box;
            overflow-y: auto;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            pointer-events: none;
        }

        .splash-shell {
            container: splash / inline-size;
            inline-size: min(34rem, 100%);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: clamp(1.35rem, 0.95rem + 2.2vw, 2rem);
        }

        .splash-brand {
            display: flex;
            align-items: center;
            gap: clamp(1rem, 0.65rem + 2vw, 1.5rem);
        }

        .splash-logo {
            position: relative;
            inline-size: clamp(4.25rem, 2.75rem + 5.5vw, 5.5rem);
            aspect-ratio: 1;
            border-radius: 1.125rem;
            overflow: hidden;
            flex-shrink: 0;
        }

        .splash-logo img {
            display: block;
            inline-size: 100%;
            block-size: 100%;
            object-fit: cover;
        }

        .splash-logo-fallback {
            display: none;
            inline-size: 100%;
            block-size: 100%;
            place-items: center;
            background: #82CAF2;
            font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 700;
            font-size: clamp(1.45rem, 1rem + 2vw, 2rem);
            letter-spacing: -0.02em;
            color: #092434;
        }

        .splash-title-group {
            min-inline-size: 0;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .splash-wordmark {
            font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-weight: 700;
            font-size: clamp(1.75rem, 1.15rem + 4vw, 2.85rem);
            line-height: 1.06;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            margin: 0;
            text-wrap: balance;
        }

        .splash-wordmark .craft {
            color: var(--accent-brand);
        }

        .splash-subtitle {
            margin: 0;
            font-size: clamp(0.95rem, 0.8rem + 0.8vw, 1.2rem);
            line-height: 1.35;
            font-weight: 500;
            color: var(--text-muted);
            text-wrap: balance;
        }

        .splash-progress {
            display: flex;
            flex-direction: column;
            gap: clamp(0.625rem, 0.45rem + 0.7vw, 0.875rem);
        }

        .splash-status {
            display: block;
            font-size: clamp(0.9375rem, 0.82rem + 0.6vw, 1.0625rem);
            line-height: 1.4;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .splash-progress-bar {
            display: block;
            inline-size: 100%;
            block-size: 0.4375rem;
            appearance: none;
            border: 0 solid;
            border-radius: 9999px;
            overflow: clip;
            background: var(--bg-track);
            container-type: inline-size;
            --progress-bar-indeterminate-size: 38%;
            --progress-bar-indeterminate-animation-duration: 1.35s;
        }

        .splash-progress-bar:indeterminate {
            --progress-bar-animation: splash-progress-indeterminate
                var(--progress-bar-indeterminate-animation-duration)
                cubic-bezier(0.4, 0, 0.2, 1)
                infinite;
        }

        .splash-progress-bar:dir(rtl):indeterminate {
            --progress-bar-animation: splash-progress-indeterminate
                var(--progress-bar-indeterminate-animation-duration)
                cubic-bezier(0.4, 0, 0.2, 1)
                infinite
                reverse;
        }

        .splash-progress-bar::-webkit-progress-bar {
            background: transparent;
        }

        .splash-progress-bar::-webkit-progress-value {
            border-radius: 9999px;
            background: var(--accent-brand);
            animation: var(--progress-bar-animation, revert-rule);
        }

        .splash-progress-bar::-moz-progress-bar {
            border-radius: 9999px;
            background: var(--accent-brand);
            animation: var(--progress-bar-animation, revert-rule);
        }

        @keyframes splash-progress-indeterminate {
            from, to {
                inline-size: var(--progress-bar-indeterminate-size);
                margin-right: auto;
            }
            from {
                translate: -100%;
            }
            to {
                translate: 100cqi;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .splash-progress-bar {
                --progress-bar-indeterminate-animation-duration: 10s;
            }
        }

        .splash-footer {
            padding-block-start: 0.25rem;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.4rem 1.25rem;
            font-size: clamp(0.875rem, 0.78rem + 0.45vw, 0.95rem);
            line-height: 1.45;
            font-weight: 500;
            color: var(--text-muted);
        }

        .splash-meta-primary,
        .splash-meta-secondary {
            min-inline-size: 0;
        }

        @supports (font-size: 1cqi) {
            .splash-brand {
                gap: clamp(1rem, 0.65rem + 2.2cqi, 1.5rem);
            }

            .splash-logo {
                inline-size: clamp(4.25rem, 2.75rem + 6.5cqi, 5.5rem);
            }

            .splash-logo-fallback {
                font-size: clamp(1.45rem, 1rem + 2.3cqi, 2rem);
            }

            .splash-wordmark {
                font-size: clamp(1.75rem, 1.15rem + 4.3cqi, 2.85rem);
            }

            .splash-subtitle {
                font-size: clamp(0.95rem, 0.8rem + 0.9cqi, 1.2rem);
            }

            .splash-progress {
                gap: clamp(0.625rem, 0.45rem + 0.8cqi, 0.875rem);
            }

            .splash-status {
                font-size: clamp(0.9375rem, 0.82rem + 0.65cqi, 1.0625rem);
            }

            .splash-footer {
                font-size: clamp(0.875rem, 0.78rem + 0.5cqi, 0.95rem);
            }
        }

        @media (forced-colors: active) {
            .splash-progress-bar {
                border: 1px solid CanvasText;
                background: Canvas;
            }

            .splash-progress-bar::-webkit-progress-value {
                background: Highlight;
            }

            .splash-progress-bar::-moz-progress-bar {
                background: Highlight;
            }
        }
    </style>
</head>
<body>
    <div id="loading" role="status" aria-live="polite" aria-label="Loading Paper Craft">
        <div class="splash-shell">
            <div class="splash-brand">
                <div class="splash-logo" aria-hidden="true">
                    <img
                        src="./papercraft-256.png"
                        alt=""
                        width="88"
                        height="88"
                        onerror="this.style.display='none';this.nextElementSibling.style.display='grid';"
                    />
                    <span class="splash-logo-fallback">PC</span>
                </div>
                <div class="splash-title-group">
                    <h1 class="splash-wordmark">Paper <span class="craft">Craft</span></h1>
                    <p class="splash-subtitle">Handwriting &amp; Notes Studio</p>
                </div>
            </div>

            <div class="splash-progress">
                <label class="splash-status" id="splash-status-label" for="splash-progress">
                    Loading WebAssembly workspace...
                </label>
                <progress
                    class="splash-progress-bar"
                    id="splash-progress"
                    aria-labelledby="splash-status-label"
                ></progress>
            </div>

            <div class="splash-footer">
                <span class="splash-meta-primary">Open Source · MIT OR Apache-2.0</span>
                <span class="splash-meta-secondary">Pure Rust &amp; WebAssembly</span>
            </div>
        </div>
    </div>

    <canvas id="the_canvas_id"></canvas>
</body>
</html>
