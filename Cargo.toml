[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.2.2"
edition = "2024"
description = "A native notebook and handwriting studio, built in pure Rust."
readme = "README.md"
repository = "https://github.com/alyxhard/papercraft"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
papercraft-geom = { path = "crates/geom" }
papercraft-color = { path = "crates/color" }
papercraft-raster = { path = "crates/raster" }
papercraft-tablet = { path = "crates/tablet" }
papercraft-doc = { path = "crates/doc" }
papercraft-ops = { path = "crates/ops" }
papercraft-paint = { path = "crates/paint" }
papercraft-compose = { path = "crates/compose" }
papercraft-format = { path = "crates/format" }
papercraft-engine = { path = "crates/engine" }
papercraft-ui-egui = { path = "crates/ui-egui" }
papercraft-sync-protocol = { path = "crates/sync-protocol" }
papercraft-sync = { path = "crates/sync" }
papercraft-updater = { path = "crates/updater" }
papercraft-server-cli = { path = "apps/papercraft-server-cli" }

# external (pure Rust)
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen", "wayland-csd-adwaita"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
redb = "4.6"
argon2 = "0.6"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "js"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json", "gzip"] }
getrandom = "0.4"
env_logger = "0.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
hayro = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico", "webp", "gif", "tiff", "tga", "pnm", "qoi"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
