name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Build Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: papercraft-windows-x86_64-portable.exe
            server_artifact: papercraft-server-windows-x86_64-portable.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: papercraft-linux-x86_64.AppImage
            server_artifact: papercraft-server-linux-x86_64.AppImage
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: papercraft-macos-arm64.dmg
            server_artifact: papercraft-server-macos-arm64.dmg
            tar_artifact: papercraft-macos-arm64.tar.gz
            server_tar_artifact: papercraft-server-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build GUI release binaries
        run: cargo build --release --target ${{ matrix.target }} -p papercraft -p papercraft-server
      - name: Package artifacts (Windows .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # TODO(signing): Sign Windows .exe release artifacts with an Alyx Labs Authenticode certificate when available.
          Copy-Item "target/${{ matrix.target }}/release/papercraft.exe" "${{ matrix.artifact }}" -Force
          Copy-Item "target/${{ matrix.target }}/release/papercraft-server.exe" "${{ matrix.server_artifact }}" -Force
      - name: Package artifacts (Linux .AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

          build_appimage() {
            local bin_src="$1"
            local bin_name="$2"
            local display_name="$3"
            local generic_name="$4"
            local comment="$5"
            local categories="$6"
            local out_file="$7"
            local appdir="${bin_name}.AppDir"

            rm -rf "${appdir}"
            mkdir -p "${appdir}/usr/bin" "${appdir}/usr/share/icons/hicolor/256x256/apps" "${appdir}/usr/share/licenses/${bin_name}"
            cp "${bin_src}" "${appdir}/usr/bin/${bin_name}"
            chmod +x "${appdir}/usr/bin/${bin_name}"
            cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md apps/papercraft/assets/branding/LICENSE-brand.txt \
              "${appdir}/usr/share/licenses/${bin_name}/"
            cp crates/compose/assets/fonts/LICENSE "${appdir}/usr/share/licenses/${bin_name}/Roboto-LICENSE.txt"
            cp crates/ui-egui/assets/fonts/OFL.txt "${appdir}/usr/share/licenses/${bin_name}/BricolageGrotesque-OFL.txt"
            cp crates/ui-egui/assets/icons/lucide/LICENSE "${appdir}/usr/share/licenses/${bin_name}/Lucide-LICENSE.txt"

            # TODO(branding): Use a dedicated papercraft-server icon PNG once designed.
            cp apps/papercraft/assets/branding/papercraft-256.png "${appdir}/${bin_name}.png"
            cp apps/papercraft/assets/branding/papercraft-256.png \
              "${appdir}/usr/share/icons/hicolor/256x256/apps/${bin_name}.png"
            ln -sf "${bin_name}.png" "${appdir}/.DirIcon"

            cat > "${appdir}/${bin_name}.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=${display_name}
          GenericName=${generic_name}
          Comment=${comment}
          Exec=${bin_name}
          Icon=${bin_name}
          Terminal=false
          Categories=${categories}
          StartupWMClass=${bin_name}
          X-Publisher=Alyx Labs
          EOF

            cat > "${appdir}/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/${bin_name}" "\$@"
          EOF
            chmod +x "${appdir}/AppRun"

            ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage --no-appstream "${appdir}" "${out_file}"
            chmod +x "${out_file}"
          }

          build_appimage \
            "target/${{ matrix.target }}/release/papercraft" \
            "papercraft" \
            "PaperCraft" \
            "Handwriting & Notes Studio" \
            "Native notebook and handwriting studio" \
            "Office;Graphics;" \
            "${{ matrix.artifact }}"

          build_appimage \
            "target/${{ matrix.target }}/release/papercraft-server" \
            "papercraft-server" \
            "PaperCraft Server" \
            "Self-Hosted Sync Server" \
            "System-tray control center for PaperCraft self-hosted sync" \
            "Network;Utility;" \
            "${{ matrix.server_artifact }}"
      - name: Package artifacts (macOS .dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          RAW_VER="${GITHUB_REF_NAME#v}"
          CORE_VER="${RAW_VER%%-*}"
          if [[ "${CORE_VER}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            APP_VER="${CORE_VER}"
          else
            APP_VER="0.7.0"
          fi

          build_macos_dmg() {
            local bin_src="$1"
            local bin_name="$2"
            local app_name="$3"
            local bundle_id="$4"
            local app_category="$5"
            local out_dmg="$6"
            local out_tar="$7"
            local stage="dmg-stage-${bin_name}"
            local app_bundle="${stage}/${app_name}.app"

            rm -rf "${stage}" "${out_dmg}" "${out_tar}"
            mkdir -p "${app_bundle}/Contents/MacOS" "${app_bundle}/Contents/Resources/licenses"
            cp "${bin_src}" "${app_bundle}/Contents/MacOS/${bin_name}"
            chmod +x "${app_bundle}/Contents/MacOS/${bin_name}"
            # TODO(branding): Use a dedicated papercraft-server.icns icon once designed.
            cp apps/papercraft/assets/branding/papercraft.icns \
              "${app_bundle}/Contents/Resources/papercraft.icns"
            cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md apps/papercraft/assets/branding/LICENSE-brand.txt \
              "${app_bundle}/Contents/Resources/licenses/"
            cp crates/compose/assets/fonts/LICENSE "${app_bundle}/Contents/Resources/licenses/Roboto-LICENSE.txt"
            cp crates/ui-egui/assets/fonts/OFL.txt "${app_bundle}/Contents/Resources/licenses/BricolageGrotesque-OFL.txt"
            cp crates/ui-egui/assets/icons/lucide/LICENSE "${app_bundle}/Contents/Resources/licenses/Lucide-LICENSE.txt"

            cat > "${app_bundle}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>${app_name}</string>
            <key>CFBundleExecutable</key>
            <string>${bin_name}</string>
            <key>CFBundleIconFile</key>
            <string>papercraft</string>
            <key>CFBundleIdentifier</key>
            <string>${bundle_id}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>${app_name}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VER}</string>
            <key>CFBundleVersion</key>
            <string>${APP_VER}</string>
            <key>LSApplicationCategoryType</key>
            <string>${app_category}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSHumanReadableCopyright</key>
            <string>Copyright © 2026 Alyx Labs</string>
          </dict>
          </plist>
          EOF

            # TODO(signing): Replace ad-hoc codesign with Apple Developer ID signing and notarization for Alyx Labs.
            codesign --force --deep --sign - "${app_bundle}"
            tar -czf "${out_tar}" -C "${stage}" "${app_name}.app"
            ln -s /Applications "${stage}/Applications"
            hdiutil create -volname "${app_name}" -srcfolder "${stage}" -ov -format UDZO "${out_dmg}"
            rm -rf "${stage}"
          }

          # TODO(org): Adjust bundle_id prefix if Alyx Labs uses a custom domain other than com.alyxlabs.
          build_macos_dmg \
            "target/${{ matrix.target }}/release/papercraft" \
            "papercraft" \
            "PaperCraft" \
            "com.alyxlabs.papercraft" \
            "public.app-category.productivity" \
            "${{ matrix.artifact }}" \
            "${{ matrix.tar_artifact }}"

          build_macos_dmg \
            "target/${{ matrix.target }}/release/papercraft-server" \
            "papercraft-server" \
            "PaperCraft Server" \
            "com.alyxlabs.papercraft.server" \
            "public.app-category.utilities" \
            "${{ matrix.server_artifact }}" \
            "${{ matrix.server_tar_artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: ${{ matrix.server_artifact }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: app-tar-${{ matrix.target }}
          path: ${{ matrix.tar_artifact }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: server-tar-${{ matrix.target }}
          path: ${{ matrix.server_tar_artifact }}

  web:
    name: Build WebAssembly Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: cargo install --locked trunk
      - name: Build release bundle
        working-directory: apps/papercraft-web
        run: trunk build --release
      - name: Package web bundle
        run: |
          mkdir -p web-pkg/licenses
          cp -r dist/* web-pkg/
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md apps/papercraft/assets/branding/LICENSE-brand.txt web-pkg/licenses/
          cp crates/compose/assets/fonts/LICENSE web-pkg/licenses/Roboto-LICENSE.txt
          cp crates/ui-egui/assets/fonts/OFL.txt web-pkg/licenses/BricolageGrotesque-OFL.txt
          cp crates/ui-egui/assets/icons/lucide/LICENSE web-pkg/licenses/Lucide-LICENSE.txt
          (cd web-pkg && zip -r ../papercraft-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: papercraft-web
          path: papercraft-web.zip

  publish:
    name: Publish GitHub Release
    needs: [desktop, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Generate latest.json update manifest
        shell: python3 {0}
        run: |
          import datetime
          import json
          import os
          import pathlib
          import subprocess

          assets_dir = pathlib.Path("release-assets")
          sums = {}
          for line in (assets_dir / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              parts = line.strip().split(maxsplit=1)
              if len(parts) == 2:
                  digest, fname = parts[0].strip(), parts[1].strip().lstrip("*")
                  sums[fname] = digest

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith(("v", "V")) else tag
          repo = os.environ["GITHUB_REPOSITORY"]
          release_url = f"https://github.com/{repo}/releases/tag/{tag}"

          prev_tag = ""
          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", "--match", "v*", f"{tag}^"],
                  stderr=subprocess.DEVNULL,
                  text=True,
              ).strip()
          except Exception:
              prev_tag = ""

          try:
              cmd = ["git", "log", "--pretty=format:- %s"] + (
                  [f"{prev_tag}..{tag}"] if prev_tag else ["-n", "15", tag]
              )
              notes = subprocess.check_output(cmd, stderr=subprocess.DEVNULL, text=True).strip()
          except Exception:
              notes = ""
          if not notes:
              notes = f"PaperCraft {tag} release."
          elif len(notes) > 4000:
              notes = notes[:3997] + "..."

          spec = {
              "papercraft": {
                  "windows-x86_64": ("papercraft-windows-x86_64-portable.exe", "exe"),
                  "linux-x86_64": ("papercraft-linux-x86_64.AppImage", "appimage"),
                  "macos-aarch64": ("papercraft-macos-arm64.tar.gz", "macos-app-tar-gz"),
              },
              "papercraft-server": {
                  "windows-x86_64": ("papercraft-server-windows-x86_64-portable.exe", "exe"),
                  "linux-x86_64": ("papercraft-server-linux-x86_64.AppImage", "appimage"),
                  "macos-aarch64": ("papercraft-server-macos-arm64.tar.gz", "macos-app-tar-gz"),
              },
          }

          manifest_assets = {}
          for app_key, platforms in spec.items():
              manifest_assets[app_key] = {}
              for plat_key, (fname, fmt) in platforms.items():
                  fpath = assets_dir / fname
                  if not fpath.is_file():
                      raise SystemExit(f"Missing release artifact `{fname}` for {app_key}/{plat_key}")
                  digest = sums.get(fname, "").lower()
                  if len(digest) != 64:
                      raise SystemExit(f"Invalid SHA-256 digest for `{fname}`: {digest!r}")
                  manifest_assets[app_key][plat_key] = {
                      "file_name": fname,
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{fname}",
                      "sha256": digest,
                      "size_bytes": fpath.stat().st_size,
                      "format": fmt,
                  }

          manifest = {
              "schema_version": 1,
              "version": version,
              "tag": tag,
              "release_url": release_url,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": notes,
              "assets": manifest_assets,
          }
          out_path = assets_dir / "latest.json"
          out_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote {out_path} for {tag}")
      - uses: softprops/action-gh-release@v2
        with:
          name: PaperCraft ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
