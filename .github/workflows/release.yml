name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Build Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: papercraft-windows-x86_64.exe
            server_artifact: papercraft-server-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: papercraft-linux-x86_64.AppImage
            server_artifact: papercraft-server-linux-x86_64.AppImage
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: papercraft-macos-arm64.dmg
            server_artifact: papercraft-server-macos-arm64.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build GUI release binaries
        run: cargo build --release --target ${{ matrix.target }} -p papercraft -p papercraft-server
      - name: Package artifacts (Windows .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/papercraft.exe" "${{ matrix.artifact }}" -Force
          Copy-Item "target/${{ matrix.target }}/release/papercraft-server.exe" "${{ matrix.server_artifact }}" -Force
      - name: Package artifacts (Linux .AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

          build_appimage() {
            local bin_src="$1"
            local bin_name="$2"
            local display_name="$3"
            local comment="$4"
            local categories="$5"
            local out_file="$6"
            local appdir="${bin_name}.AppDir"

            rm -rf "${appdir}"
            mkdir -p "${appdir}/usr/bin" "${appdir}/usr/share/icons/hicolor/256x256/apps"
            cp "${bin_src}" "${appdir}/usr/bin/${bin_name}"
            chmod +x "${appdir}/usr/bin/${bin_name}"

            cp apps/papercraft/assets/branding/papercraft-256.png "${appdir}/${bin_name}.png"
            cp apps/papercraft/assets/branding/papercraft-256.png \
              "${appdir}/usr/share/icons/hicolor/256x256/apps/${bin_name}.png"
            ln -sf "${bin_name}.png" "${appdir}/.DirIcon"

            cat > "${appdir}/${bin_name}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${display_name}
          Comment=${comment}
          Exec=${bin_name}
          Icon=${bin_name}
          Terminal=false
          Categories=${categories}
          EOF

            cat > "${appdir}/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/${bin_name}" "\$@"
          EOF
            chmod +x "${appdir}/AppRun"

            ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage --no-appstream "${appdir}" "${out_file}"
            chmod +x "${out_file}"
          }

          build_appimage \
            "target/${{ matrix.target }}/release/papercraft" \
            "papercraft" \
            "PaperCraft" \
            "Native notebook and handwriting studio" \
            "Office;Graphics;" \
            "${{ matrix.artifact }}"

          build_appimage \
            "target/${{ matrix.target }}/release/papercraft-server" \
            "papercraft-server" \
            "PaperCraft Server" \
            "System-tray control center for PaperCraft self-hosted sync" \
            "Network;Utility;" \
            "${{ matrix.server_artifact }}"
      - name: Package artifacts (macOS .dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          RAW_VER="${GITHUB_REF_NAME#v}"
          if [[ "${RAW_VER}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            APP_VER="${RAW_VER}"
          else
            APP_VER="0.1.0"
          fi

          build_macos_dmg() {
            local bin_src="$1"
            local bin_name="$2"
            local app_name="$3"
            local bundle_id="$4"
            local out_dmg="$5"
            local stage="dmg-stage-${bin_name}"
            local app_bundle="${stage}/${app_name}.app"

            rm -rf "${stage}" "${out_dmg}"
            mkdir -p "${app_bundle}/Contents/MacOS" "${app_bundle}/Contents/Resources"
            cp "${bin_src}" "${app_bundle}/Contents/MacOS/${bin_name}"
            chmod +x "${app_bundle}/Contents/MacOS/${bin_name}"
            cp apps/papercraft/assets/branding/papercraft.icns \
              "${app_bundle}/Contents/Resources/papercraft.icns"

            cat > "${app_bundle}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>${app_name}</string>
            <key>CFBundleExecutable</key>
            <string>${bin_name}</string>
            <key>CFBundleIconFile</key>
            <string>papercraft</string>
            <key>CFBundleIdentifier</key>
            <string>${bundle_id}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>${app_name}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VER}</string>
            <key>CFBundleVersion</key>
            <string>${APP_VER}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

            codesign --force --deep --sign - "${app_bundle}"
            ln -s /Applications "${stage}/Applications"
            hdiutil create -volname "${app_name}" -srcfolder "${stage}" -ov -format UDZO "${out_dmg}"
            rm -rf "${stage}"
          }

          build_macos_dmg \
            "target/${{ matrix.target }}/release/papercraft" \
            "papercraft" \
            "PaperCraft" \
            "io.papercraft.app" \
            "${{ matrix.artifact }}"

          build_macos_dmg \
            "target/${{ matrix.target }}/release/papercraft-server" \
            "papercraft-server" \
            "PaperCraft Server" \
            "io.papercraft.server" \
            "${{ matrix.server_artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: ${{ matrix.server_artifact }}

  web:
    name: Build WebAssembly Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: cargo install --locked trunk
      - name: Build release bundle
        working-directory: apps/papercraft-web
        run: trunk build --release
      - name: Package web bundle
        run: |
          mkdir -p web-pkg
          cp -r dist/* web-pkg/
          (cd web-pkg && zip -r ../papercraft-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: papercraft-web
          path: papercraft-web.zip

  publish:
    name: Publish GitHub Release
    needs: [desktop, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
